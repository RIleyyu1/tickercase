[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickercase"
version = "0.9.0"
description = "Turn one sentence about a stock into a probability range from free public data, with every number traced to its source."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "anthropic>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "live: performs real network requests to SEC; skipped unless TICKERCASE_RUN_LIVE=1",
]
