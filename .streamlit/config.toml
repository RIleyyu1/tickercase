# Cockpit look (v0.9): one dark theme; the casing, panels and screens are drawn by the page CSS (tickercase/ui/cockpit.py).
[theme]
base = "dark"
# labels and keys in IBM Plex Mono, Chinese in Noto Serif SC (both Google Fonts, OFL). Streamlit takes one source URL
# per property, so the body font loads IBM Plex Mono and the heading font loads Noto Serif SC; the body falls back to it.
font = "'IBM Plex Mono', 'Noto Serif SC', monospace:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
headingFont = "'Noto Serif SC', serif:https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap"
codeFont = "'IBM Plex Mono', monospace"
baseRadius = "0rem"
showWidgetBorder = true
primaryColor = "#C49A4A"
backgroundColor = "#1C1A17"
secondaryBackgroundColor = "#2F2C29"
textColor = "#E3DAC0"
linkColor = "#FFB23E"
redColor = "#D9392C"
orangeColor = "#C49A4A"
yellowColor = "#FFB23E"
greenColor = "#74FF9A"
blueColor = "#5E7279"

# screen fonts, served from ./static (both OFL; licences next to the files)
[[theme.fontFaces]]
family = "FusionPixel"
url = "app/static/fonts/fusion-pixel-12px-monospaced-zh_hans.otf.woff2"

[[theme.fontFaces]]
family = "VT323"
url = "app/static/fonts/VT323-Regular.woff2"

[server]
# fonts and textures under ./static, served at /app/static/
enableStaticServing = true

[browser]
gatherUsageStats = false
